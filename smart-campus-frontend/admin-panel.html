<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Panel | Smart Campus</title>
  <link rel="stylesheet" href="static/css/style.css" />
  <style>
    body { font-family: "Poppins", sans-serif; background:#e9f3fb; margin:0; }
    .navbar { background:#0077b6; color:#fff; padding:14px 40px; display:flex; justify-content:space-between; align-items:center; }
    .navbar h1 { margin:0; font-size:1.25rem; }
    .nav-links a { color:#fff; margin-left:18px; text-decoration:none; }
    .container { max-width:1100px; margin:36px auto; padding:0 20px; }
    .card { background:#fff; border-radius:12px; padding:22px; box-shadow:0 6px 20px rgba(0,0,0,0.08); }
    h2 { color:#023e8a; margin:0 0 8px 0; }
    .muted { color:#666; margin-bottom:18px; }

    /* table */
    table { width:100%; border-collapse:collapse; margin-top:14px; }
    thead th { text-align:left; padding:12px 10px; border-bottom:1px solid #eee; color:#0b3a66; }
    tbody td { padding:12px 10px; border-bottom:1px solid #f3f3f3; vertical-align:middle; }
    .small { font-size:0.9rem; color:#555; }
    .role-select { padding:6px 8px; border-radius:6px; border:1px solid #ddd; }
    .btn { padding:8px 12px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
    .btn-save { background:#00b4d8; color:#fff; }
    .btn-delete { background:#ef4444; color:#fff; }
    .actions { display:flex; gap:8px; align-items:center; }

    .top-controls { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
    .search { padding:8px 12px; border-radius:8px; border:1px solid #ddd; width:260px; }

    @media (max-width:880px){
      .top-controls { flex-direction:column; align-items:stretch; gap:10px; }
      .search{ width:100%; }

    /* ensure selects are visible and full width in table cells */
.role-select {
  min-width: 120px;
  padding: 6px 8px;
  background: #fff;
  color: #0b3a66;
  border: 1px solid #ddd;
}

    }
    /* --- Fix invisible text in inputs/selects/table cells --- */
input, select, textarea, .search, .role-select, table td, table th {
  color: #0b3a66 !important;           /* dark blue text so it's visible */
}

/* placeholder color */
input::placeholder, .search::placeholder {
  color: #9aa8b3 !important;
}

/* ensure option text inside selects is visible on some browsers */
select option {
  color: #0b3a66 !important;
}

/* when input is focused keep the text visible */
input:focus, textarea:focus, select:focus {
  color: #0b3a66 !important;
  -webkit-text-fill-color: #0b3a66 !important; /* addresses Chrome autofill/appearance issues */
}

/* table small text contrast */
table td.small { color: #334155 !important; }

  </style>
</head>
<body>
  <header class="navbar">
    <h1>Smart Campus Companion — Admin Panel</h1>
    <div class="nav-links">
      <a href="dashboard/admin_dashboard.html">Dashboard</a>
      <a href="login.html">Logout</a>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div class="top-controls">
        <div>
          <h2>Users</h2>
          <div class="muted">View and manage registered users (change roles, delete accounts)</div>
        </div>

        <div>
          <input id="searchInput" class="search" placeholder="Search by name or email" />
          <button id="refreshBtn" class="btn" style="margin-left:8px;">Refresh</button>
        </div>
      </div>

      <div id="tableWrapper">
        <table id="usersTable" aria-live="polite">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Created At</th>
              <th style="width:220px">Actions</th>
            </tr>
          </thead>
          <tbody id="usersBody">
            <!-- Rows populated by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="static/js/admin.js"></script>
</body>
</html>
