<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auditorium Booking</title>
  <link rel="stylesheet" href="../static/css/ground_booking.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="brand">Smart Campus Companion</div>
    </header>

    <main class="container">
      <section class="left card">
        <h2>Request Auditorium Booking</h2>
        <p class="hint">Only faculty should request bookings. Students view approved bookings.</p>

        <!-- role selector for demo only (replace with auth ) -->
        <!--<div class="row">
          <label>Role</label>
          <select id="roleSelect">
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
            <option value="admin">Admin</option>
          </select>
        </div>-->

          <script src="../static/js/auth.js"></script>
  <script>
    requireRole(['student','faculty','admin']);
  </script>

        <div id="facultyForm">
          <label>Event name</label>
          <input id="eventName" type="text" placeholder="e.g. Guest Lecture">

          <div class="row">
            <div>
              <label>Date</label>
              <input id="eventDate" type="date">
            </div>
            <div>
              <label>Start</label>
              <input id="startTime" type="time">
            </div>
            <div>
              <label>End</label>
              <input id="endTime" type="time">
            </div>
          </div>

          <button id="requestBtn" class="btn primary">Request Booking</button>
        </div>

        <div id="info" class="info"></div>
      </section>

      <section class="right card">
        <div class="filter-row">
          <label>Status</label>
          <select id="statusFilter">
            <option value="All">All</option>
            <option value="Pending">Pending</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
          </select>
          <button id="refreshBtn" class="btn">Refresh</button>
        </div>

        <div id="bookingsList" class="list"></div>
      </section>
    </main>
  </div>

<script>
  const BACKEND_BASE = 'http://127.0.0.1:5000';

  (function(){
    const role = (localStorage.getItem('role')||'').toLowerCase();
    const user_id = localStorage.getItem('user_id');
    const name = localStorage.getItem('user_name') || '';
    const info = document.getElementById('info');
    if(info) info.textContent = name + (role ? (' ('+role+')') : '');

    if(!['faculty','admin'].includes(role)){
      info.textContent = 'Only faculty (or admin) may request bookings.';
      document.getElementById('requestBtn').disabled = true;
    }

    const bookingsList = document.getElementById('bookingsList');
    const refreshBtn = document.getElementById('refreshBtn');
    const filterStatus = document.getElementById('statusFilter');
    const msgEl = document.getElementById('info');

    document.getElementById('requestBtn').addEventListener('click', async () => {
      msgEl.style.color = '#0b3a66';
      const event_name = document.getElementById('eventName').value.trim();
      const date = document.getElementById('eventDate').value;
      const start_time = document.getElementById('startTime').value;
      const end_time = document.getElementById('endTime').value;

      if(!event_name || !date || !start_time || !end_time){
        msgEl.style.color = '#b00020';
        msgEl.textContent = 'Please fill all fields.';
        return;
      }

      try {
        const res = await fetch(BACKEND_BASE + '/book_auditorium', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ user_id, event_name, date, start_time, end_time })
        });
        const j = await res.json();
        if(res.ok){
          msgEl.style.color = 'green';
          msgEl.textContent = j.message || 'Requested. Pending approval.';
          document.getElementById('eventName').value='';
          document.getElementById('eventDate').value='';
          document.getElementById('startTime').value='';
          document.getElementById('endTime').value='';
          loadBookings();
        } else {
          msgEl.style.color = '#b00020';
          msgEl.textContent = j.error || j.message || `Server: ${res.status}`;
        }
      } catch (err){
        console.error(err);
        msgEl.style.color = '#b00020';
        msgEl.textContent = 'Unable to send request. Check backend.';
      }
    });

    async function loadBookings(){
      bookingsList.innerHTML = '<div style="color:#6b7780">Loading bookings...</div>';
      try {
        const params = new URLSearchParams();
        params.set('role', role === 'faculty' ? 'faculty' : 'student');
        if(role === 'faculty' && user_id) params.set('user_id', user_id);
        const status = filterStatus.value;
        if(status && status !== 'All') params.set('status', status);
        const res = await fetch(BACKEND_BASE + '/get_auditorium_bookings?' + params.toString());
        if(!res.ok){ bookingsList.innerHTML = `<div style="color:#b00020">Server: ${res.status}</div>`; return; }
        const rows = await res.json();
        if(!rows || rows.length===0){ bookingsList.innerHTML = '<div style="color:#6b7780">No bookings</div>'; return; }
        bookingsList.innerHTML = rows.map(r => `
          <div class="booking-item">
            <div style="font-weight:700">${escapeHtml(r.event_name||'Event')}</div>
            <div class="meta">• ${escapeHtml(r.date||'')} ${escapeHtml(r.start_time||'')} - ${escapeHtml(r.end_time||'')}</div>
            <div style="margin-top:8px;color:#073147;font-weight:700">Status: ${escapeHtml(r.status||'')}</div>
          </div>
        `).join('');
      } catch (err){
        console.error(err);
        bookingsList.innerHTML = '<div style="color:#b00020">Unable to load bookings (see console)</div>';
      }
    }

    refreshBtn.addEventListener('click', loadBookings);
    filterStatus.addEventListener('change', loadBookings);

    // initial load
    loadBookings();

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
  })();
</script>
</body>
</html>
