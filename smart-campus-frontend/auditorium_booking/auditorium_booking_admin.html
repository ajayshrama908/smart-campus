<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin — Auditorium Requests</title>
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
  <header class="topbar">
    <div style="font-weight:700;font-size:1.2rem">Smart Campus Companion</div>
    <div id="userInfo" style="color:#fff; margin-left:auto; padding-right:18px;"></div>
  </header>

  <main style="max-width:1000px; margin:40px auto;">
    <section class="module-card" style="padding:24px;">
      <h2>Pending Auditorium Requests</h2>
      <div style="margin-top:12px;">
        <button id="refreshBtn" class="btn">Refresh</button>
      </div>

      <div id="requests" style="margin-top:18px; color:#073147;">
        Loading...
      </div>
    </section>
  </main>

  <script>
    const BACKEND_BASE = 'http://127.0.0.1:5000'; // change if backend runs elsewhere

    (function(){
      const info = document.getElementById('userInfo');
      if(info) info.textContent = localStorage.getItem('user_name') || '';

      const requests = document.getElementById('requests');
      const refreshBtn = document.getElementById('refreshBtn');

      async function loadPending(){
        requests.textContent = 'Loading...';
        try {
          const res = await fetch(BACKEND_BASE + '/get_auditorium_bookings?role=admin&status=Pending');
          if(!res.ok){ requests.textContent = `Server: ${res.status}`; return; }
          const rows = await res.json();
          if(!rows || rows.length === 0){
            requests.innerHTML = '<div>No pending requests</div>';
            return;
          }
          requests.innerHTML = rows.map(r => {
            const date = r.date || '';
            const st = r.start_time || '';
            const et = r.end_time || '';
            const en = escapeHtml(r.event_name || 'Event');
            const requester = escapeHtml(r.requester_name || 'Unknown');
            return `
              <div style="background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;color:#073147;">
                <div style="font-weight:700">${en}</div>
                <div style="margin-top:6px">${requester} • ${date} ${st} - ${et}</div>
                <div style="margin-top:8px;">
                  <button class="approveBtn" data-id="${r.id}" style="margin-right:8px;">Approve</button>
                  <button class="rejectBtn" data-id="${r.id}">Reject</button>
                </div>
              </div>
            `;
          }).join('');
          document.querySelectorAll('.approveBtn').forEach(b=>{
            b.addEventListener('click', () => updateStatus(b.dataset.id, 'Approved'));
          });
          document.querySelectorAll('.rejectBtn').forEach(b=>{
            b.addEventListener('click', () => updateStatus(b.dataset.id, 'Rejected'));
          });
        } catch (err){
          console.error(err);
          requests.textContent = 'Unable to load requests (check console).';
        }
      }

      async function updateStatus(id, status){
        try {
          const res = await fetch(BACKEND_BASE + '/update_auditorium_booking_status', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ booking_id: id, status })
          });
          const j = await res.json();
          if(res.ok){
            alert(j.message || 'Updated');
            loadPending();
          } else {
            alert(j.error || j.message || `Server ${res.status}`);
          }
        } catch (err){
          console.error(err);
          alert('Unable to update (see console).');
        }
      }

      refreshBtn.addEventListener('click', loadPending);
      loadPending();

      function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
    })();
  </script>
</body>
</html>
