<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Auditorium Bookings</title>

  <link rel="stylesheet" href="../static/css/style.css">
  <link rel="stylesheet" href="../static/css/auditorium_booking_view.css">
</head>
<body>
  <header class="topbar">
    <div style="font-weight:700;font-size:1.2rem">Smart Campus Companion</div>
    <div id="userInfo" style="color:#fff; margin-left:auto; padding-right:18px;"></div>
  </header>

  <main class="page-wrap">
    <div class="card">
      <!-- LEFT -->
      <div>
        <div class="title">Auditorium Bookings</div>
        <div class="note">Students see only approved bookings; faculty/admin see their bookings or all (admin).</div>
      </div>

      <!-- CENTER -->
      <div>
        <div class="controls">
          <select id="statusSelect" class="select">
            <option value="">All</option>
            <option value="Pending">Pending</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
          </select>
          <button id="refreshBtn" class="btn">Refresh</button>
        </div>

        <div class="content" id="mainContent">
          <!-- optional larger detail area; kept minimal -->
          <div style="color:#6b7780; font-size:14px;">Select a booking on the right to view details here.</div>
        </div>
      </div>

      <!-- RIGHT -->
      <aside>
        <div class="bookings" id="bookingsList">
          <!-- bookings injected here -->
        </div>
      </aside>
    </div>
  </main>

  <script>
    const BACKEND_BASE = 'http://127.0.0.1:5000';

    (function(){
      const role = (localStorage.getItem('role')||'').toLowerCase();
      const user_id = localStorage.getItem('user_id');
      const info = document.getElementById('userInfo');
      if(info) info.textContent = (localStorage.getItem('user_name') || '') + (role ? (' ('+role+')') : '');

      const statusSelect = document.getElementById('statusSelect');
      const refreshBtn = document.getElementById('refreshBtn');
      const listDiv = document.getElementById('bookingsList');
      const mainContent = document.getElementById('mainContent');

      if(role === 'student'){
        statusSelect.value = 'Approved';
        statusSelect.disabled = true;
      }

      function renderBooking(r){
        const date = r.date || '';
        const st = r.start_time || '';
        const et = r.end_time || '';
        const en = escapeHtml(r.event_name || 'Event');
        const requester = escapeHtml(r.requester_name || 'Unknown');
        const status = r.status || '';
        return `
          <div class="booking-item" data-id="${r.id || ''}">
            <h4>${en}</h4>
            <div class="meta">${requester} • ${date} ${st} - ${et}</div>
            <div>Status: <span class="status">${status}</span></div>
          </div>
        `;
      }

      async function loadBookings(){
        listDiv.innerHTML = '<div style="color:#6b7780">Loading...</div>';
        const params = new URLSearchParams();
        params.set('role', role || 'student');
        if(role === 'faculty' && user_id) params.set('user_id', user_id);
        const status = statusSelect.value || 'All';
        params.set('status', status);

        try {
          const res = await fetch(BACKEND_BASE + '/get_auditorium_bookings?' + params.toString());
          if(!res.ok){
            listDiv.innerHTML = `<div style="color:#b00020">Server error: ${res.status}</div>`;
            return;
          }
          const rows = await res.json();
          if(!Array.isArray(rows) || rows.length === 0){
            listDiv.innerHTML = '<div style="color:#6b7780">No bookings found.</div>';
            return;
          }

          listDiv.innerHTML = rows.map(r => renderBooking(r)).join('');

          // clicking a booking shows its details in center
          document.querySelectorAll('.booking-item').forEach(el => {
            el.addEventListener('click', () => {
              const id = el.getAttribute('data-id');
              // find the record
              const rec = rows.find(x => String(x.id) === String(id)) || rows[0];
              showDetails(rec);
            });
          });
        } catch (err){
          console.error(err);
          listDiv.innerHTML = '<div style="color:#b00020">Unable to load bookings (see console).</div>';
        }
      }

      function showDetails(r){
        if(!r) return;
        mainContent.innerHTML = `
          <div style="font-size:18px; font-weight:700; color:#073245;">${escapeHtml(r.event_name)}</div>
          <div style="margin-top:8px; color:#6b7780;">${escapeHtml(r.requester_name || 'Unknown')} • ${escapeHtml(r.date)} ${escapeHtml(r.start_time)} - ${escapeHtml(r.end_time)}</div>
          <div style="margin-top:12px;">Status: <strong>${escapeHtml(r.status)}</strong></div>
          ${r.description ? `<div style="margin-top:12px; color:#333">${escapeHtml(r.description)}</div>` : ''}
        `;
      }

      refreshBtn.addEventListener('click', loadBookings);
      statusSelect.addEventListener('change', loadBookings);
      loadBookings();

      function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
    })();
  </script>
</body>
</html>
