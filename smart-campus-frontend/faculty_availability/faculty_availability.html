<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Faculty Availability | Smart Campus</title>
  <link rel="stylesheet" href="../static/css/style.css">
  <style>
    .card { background:#fff;padding:28px;border-radius:12px;box-shadow:0 8px 30px rgba(2,6,23,0.06); }
    table { width:100%; border-collapse:collapse; margin-top:18px; }
    th, td { padding:12px;border-bottom:1px solid #eef4f8; text-align:left; }
    .badge-available { background:#16a34a;color:#fff;padding:8px 12px;border-radius:20px; font-weight:700; }
    .badge-busy { background:#f97316;color:#fff;padding:8px 12px;border-radius:20px; font-weight:700; }
    .badge-leave { background:#f59e0b;color:#fff;padding:8px 12px;border-radius:20px; font-weight:700; }
    .controls { display:flex; gap:10px; align-items:center; }
    .update-btn { background:#06b6d4;padding:10px 14px;border-radius:8px;border:none;color:#022;font-weight:700; }
    .muted { color:#6b7780; }
    .error { color:#b00020; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="container"><div class="brand">Smart Campus Companion</div></div>
  </header>

  <main class="container" style="padding:40px;">
    <div class="card">
      <h2>Faculty Availability</h2>
      <p>Update your availability — table below shows latest for all faculty.</p>

      <div style="margin-top:12px;" class="controls">
        <label>Update Your Availability:
          <select id="myStatus" style="margin-left:8px;padding:8px;border-radius:8px;">
            <option value="Available">Available</option>
            <option value="Busy">Busy</option>
            <option value="On Leave">On Leave</option>
          </select>
        </label>
        <button class="update-btn" id="updateBtn">Update</button>
        <button style="margin-left:auto;padding:8px 12px;border-radius:8px;background:#e6eef3;border:none;" id="refresh">Refresh</button>
      </div>

      <div id="tableWrap"></div>
      <div id="statusMessage" style="margin-top:12px"></div>
    </div>
  </main>

  <script>
    // Backend base URL
    const BACKEND = 'http://127.0.0.1:5000';

    // Elements
    const tableWrap = document.getElementById('tableWrap');
    const refreshBtn = document.getElementById('refresh');
    const updateBtn = document.getElementById('updateBtn');
    const myStatus = document.getElementById('myStatus');
    const statusMessage = document.getElementById('statusMessage');

    // helper to show messages
    function showMessage(msg, isError=false) {
      statusMessage.textContent = msg;
      statusMessage.className = isError ? 'error' : 'muted';
    }

    async function loadList(){
      try {
        const res = await fetch(BACKEND + '/list_faculty_availability');
        if(!res.ok) throw new Error('Server ' + res.status);
        const rows = await res.json();
        if(!Array.isArray(rows)) { tableWrap.innerHTML = '<div style="color:red">Error</div>'; return; }
        if(rows.length===0){ tableWrap.innerHTML = '<div>No records</div>'; return; }

        let html = '<table><thead><tr><th>Faculty Name</th><th>Status</th><th>Last Updated</th></tr></thead><tbody>';
        for(const r of rows){
          let badge = '<span class="badge-available">Available</span>';
          if(r.status === 'Busy') badge = '<span class="badge-busy">Busy</span>';
          if(r.status === 'On Leave') badge = '<span class="badge-leave">On Leave</span>';

          const updated = r.updated_at || r.updatedAt || '';
          const safeName = String(r.faculty_name || r.name || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          html += `<tr><td>${safeName}</td><td>${badge}</td><td>${updated}</td></tr>`;
        }
        html += '</tbody></table>';
        tableWrap.innerHTML = html;
      } catch(err) {
        console.error(err);
        tableWrap.innerHTML = '<div style="color:#b00020">Unable to load availability (see console)</div>';
      }
    }

    // UPDATED fetch: sends X-User-Role and X-User-Name in headers
    async function updateAvailability() {
      statusMessage.textContent = '';
      const status = myStatus.value;

      // Get identity from localStorage (set at login)
      const role = (localStorage.getItem('role') || '').toLowerCase();
      const name = localStorage.getItem('user_name') || '';

      // Basic client-side check (UI privacy). Server enforces final check.
      if(role !== 'faculty') {
        showMessage('Only faculty may update availability.', true);
        return;
      }
      if(!name) {
        showMessage('User not identified. Please login.', true);
        return;
      }

      // Build payload
      const payload = { faculty_name: name, status };

      try {
        const res = await fetch(BACKEND + '/update_faculty_availability', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            // === important headers the backend will read ===
            'X-User-Role': role,
            'X-User-Name': name
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(()=>({}));
        if(res.ok) {
          showMessage(data.message || 'Availability updated.');
          loadList();
        } else {
          // server returns 403 or 400 with message
          showMessage(data.error || data.message || ('Server: ' + res.status), true);
        }
      } catch(err) {
        console.error(err);
        showMessage('Network error — check backend.', true);
      }
    }

    // wire events
    refreshBtn.addEventListener('click', loadList);
    updateBtn.addEventListener('click', updateAvailability);

    // on load: hide update UI when not faculty (optional)
    (function initRoleUI(){
      const role = (localStorage.getItem('role') || '').toLowerCase();
      if(role !== 'faculty') {
        // disable update button and show message
        updateBtn.disabled = true;
        showMessage('Viewing as non-faculty — updates are disabled.');
      } else {
        updateBtn.disabled = false;
      }
    })();

    // initial load
    loadList();
  </script>
</body>
</html>
