<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Lost & Found — Admin</title>
  <link rel="stylesheet" href="../static/css/style.css" />

  <style>
    body {
      background: linear-gradient(180deg,#082433,#08344f);
      font-family: "Inter", system-ui, sans-serif;
      color: #022;
    }
    header {
      padding: 16px 28px;
      color: #fff;
      font-weight: 700;
      font-size: 1.2rem;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(6px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .wrap {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 18px;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }
    .card h3 {
      margin-bottom: 16px;
      font-size: 1.3rem;
      color: #08344f;
    }
    .item {
      display: flex;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid #eef;
      align-items: flex-start;
    }
    .thumb {
      width: 120px;
      height: 90px;
      background: #e9eef0;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .item strong {
      font-size: 1.05rem;
      color: #08344f;
    }
    .muted {
      color: #6b7780;
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .btn {
      background: #12c1b2;
      color: #022;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(18,193,178,0.4);
    }
    .actions {
      margin-top: 10px;
    }
    /* Status badges */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 6px;
    }
    .badge.lost { background:#cd314e; color:#fff; }
    .badge.found { background:#dfc149; color:#222; }
    .badge.returned { background:#40ba6d; color:#fff; }
  </style>
</head>
<body>
  <header>Lost & Found — Admin</header>
  <main class="wrap">
    <div class="card">
      <h3>Reports</h3>
      <div id="list"></div>
    </div>
  </main>

  <script>
    const BACKEND_BASE = 'http://127.0.0.1:5000';

    async function load(){
      const el = document.getElementById('list');
      el.innerHTML = '<p style="color:#6b7780">Loading reports...</p>';
      try {
        const res = await fetch(BACKEND_BASE + '/get_lost_items');
        if(!res.ok){ el.innerHTML = `<p style="color:#b00020">Server error: ${res.status}</p>`; return; }
        const rows = await res.json();
        el.innerHTML = '';
        if(!rows || rows.length === 0){
          el.innerHTML = '<p style="color:#6b7780">No reports available</p>';
          return;
        }
        rows.forEach(r=>{
          const d = document.createElement('div');
          d.className = 'item';

          // Thumbnail
          const img = document.createElement('img');
          img.className = 'thumb';
          img.src = r.image_url || '../static/img/placeholder.png';
          img.onerror = ()=> img.src = '../static/img/placeholder.png';

          // Body
          const body = document.createElement('div');
          body.style.flex = '1';

          // Status badge
          let badgeClass = '';
          let badgeText = '';
          if(r.status === 'Lost'){ badgeClass='lost'; badgeText='Lost '; }
          else if(r.status === 'Found'){ badgeClass='found'; badgeText='Found '; }
          else if(r.status === 'Returned'){ badgeClass='returned'; badgeText='Returned '; }

          body.innerHTML = `
            <strong>${escapeHtml(r.item_name)}</strong>
            <div class="muted">${escapeHtml(r.description||'')}</div>
            <span class="badge ${badgeClass}">${badgeText}</span>
            <div class="actions">
              <button class="btn" onclick="mark(${r.item_id},'Found')">Mark Found</button>
              <button class="btn" style="margin-left:8px" onclick="mark(${r.item_id},'Returned')">Mark Returned</button>
            </div>
          `;

          d.appendChild(img);
          d.appendChild(body);
          el.appendChild(d);
        });
      } catch(err){
        console.error(err);
        el.innerHTML = '<p style="color:#b00020">Unable to load reports (see console)</p>';
      }
    }

    async function mark(id,status){
      try {
        const res = await fetch(BACKEND_BASE + '/update_lost_status',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ item_id:id, status })
        });
        const j = await res.json();
        if(res.ok){
          load();
        } else {
          alert(j.error || j.message || `Server error: ${res.status}`);
        }
      } catch(err){
        console.error(err);
        alert('Unable to update status (see console).');
      }
    }

    function escapeHtml(s){
      return String(s||'').replace(/[&<>"']/g, c=>({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      })[c]);
    }

    // Initial load
    load();
  </script>
</body>
</html>
