<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Smart Campus - Register</title>
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>
  <nav class="nav">
    <div class="container">
       <div class="brand" style="display:flex;align-items:center;gap:10px;">
  <img src="assets/sm4.png" alt="Smart Campus Logo" style="height:36px;border-radius:6px;">
  <span style="color:#fff;font-weight:700;font-size:18px;">Smart Campus</span>
</div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="about.html">About</a>
      </div>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-card">
      <h1>Create Your Account</h1>
      <p>Join the Smart Campus platform to manage your academic journey.</p>

      <form id="registerForm" class="form" novalidate>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullname" placeholder="Enter your name" required />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="Enter your email" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
        </div>

        <div class="form-group">
          <label>Role</label>
          <select id="role" required>
            <option value="">-- Choose Role --</option>
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <button type="submit" class="btn">Register</button>
        <p id="message" class="msg"></p>
      </form>
    </div>
  </section>

  <footer class="footer">
    <p>© 2025 Smart Campus | All rights reserved.</p>
  </footer>

  <script src="static/js/register.js"></script>
</body>
</html>
